<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha E-Commerce</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav>
            <a href="#" class="logo">CodeAlpha Store</a>

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#products">Products</a></li>
                <li><a href="#cart">Cart</a></li>
                <li><a href="#login">Login</a></li>
            </ul>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <!-- Hero Section -->
        <section class="hero">

            <div class="hero-content">

                <p class="hero-subtitle">
                    PREMIUM PRODUCTS. BETTER EVERY DAY.
                </p>

                <h1>
                    Discover Your Next Favorite Product
                </h1>

                <p>
                    Explore our collection of modern products
                    designed for your everyday life.
                </p>

                <a href="#products">
                    Shop Now
                </a>

            </div>

        </section>


        <!-- Products Section -->
        <section id="products">

            <h2>Our Products</h2>

            <div class="products-container"></div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 CodeAlpha Store. All rights reserved.
        </p>

    </footer>

    <script src="js/app.js"></script>

</body>

</html>
